version: '3.8'

# FREE TIER DOCKER COMPOSE - NO PAID SERVICES
# This configuration uses only free, open-source components
# Perfect for local development and free-tier deployments

services:
  # SQLite is used instead of PostgreSQL for simplicity (file-based, no server needed)
  # If you need PostgreSQL, it's included below but commented out
  
  # PostgreSQL Database (OPTIONAL - can use SQLite instead for free tier)
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: assetML
  #     POSTGRES_USER: assetML_user
  #     POSTGRES_PASSWORD: free_password_123
  #   volumes:
  #     - ./data/postgres:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

  # Redis Cache (OPTIONAL - can use in-memory caching instead)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --requirepass free_redis_123
    volumes:
      - ./data/redis:/data

  # Main Application - Streamlit Dashboard (FREE)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=sqlite:///./data/assetML.db  # Use SQLite instead of PostgreSQL
      - REDIS_URL=redis://default:free_redis_123@redis:6379
      - ENVIRONMENT=development
      - USE_FREE_TIER=true
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs

  # FastAPI (OPTIONAL - for API access)
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.api
  #   environment:
  #     - DATABASE_URL=sqlite:///./data/assetML.db
  #     - REDIS_URL=redis://default:free_redis_123@redis:6379
  #     - JWT_SECRET=free_jwt_secret_change_in_production
  #     - ENVIRONMENT=development
  #     - USE_FREE_TIER=true
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - redis
  #   restart: unless-stopped
  #   volumes:
  #     - ./logs:/app/logs
  #     - ./data:/app/data
  #     - ./models:/app/models

  # Prometheus (FREE - for basic monitoring)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus-free.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana (FREE - for visualization)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=free_grafana_123
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  # All data stored locally - no cloud storage costs
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    driver: bridge

# FREE TIER NOTES:
# - Uses SQLite instead of PostgreSQL (no server needed)
# - Redis included but optional (can use in-memory caching)
# - No Nginx (direct port access)
# - No paid monitoring services
# - All data stored locally
# - Perfect for development and small-scale free deployments